{% load static %}

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="{% static 'imagens/icon.ico' %}" sizes="any">
  <title>Entrar</title>
  <style>
    body {
      align-items: center;
      background: #f4f6f9;
      display: flex;
      font-family: Arial, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
    }

    .login {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      padding: 2rem;
      width: min(100% - 2rem, 24rem);
    }

    h1 {
      color: #f90;
      font-size: 1.5rem;
      margin: 0 0 1.5rem;
      text-align: center;
    }

    label {
      display: block;
      margin: 1rem 0 0.4rem;
    }

    input {
      border: 1px solid #aaa;
      border-radius: 4px;
      box-sizing: border-box;
      font: inherit;
      padding: 0.7rem;
      width: 100%;
    }

    input:focus {
      border-color: #f90;
      outline: 2px solid #f90;
      outline-offset: 1px;
    }

    button {
      background: #f90;
      border: 0;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font: inherit;
      margin-top: 1.5rem;
      padding: 0.75rem;
      width: 100%;
    }

    button:hover {
      background: rgb(198, 123, 10);
    }
  </style>
</head>
<body>
  <main class="login">
    <h1>Entrar na sua conta</h1>
    <form method="post" action="{% url 'auth-login' %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">

      {% if erro %}
      <p role="alert">{{ erro }}</p>
      {% endif %}

      <label for="username">Usuário</label>
      <input type="text" name="username" id="username" autocomplete="username" required>

      <label for="password">Senha</label>
      <input type="password" name="password" id="password" autocomplete="current-password" required>

      <button type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
