{% extends 'nucleo/base.html' %}

{% block titulo %}Edição{% endblock %}

{% block conteudo %}
<h1>Editar Equipamento</h1>

<form action="{% url 'equipa-editar' equipamento.id %}" method="POST" class="formulario">
    <div>
        <label>Nome</label>
        <input type="text" name="nome" value="{{ equipamento.nome }}"/>
    </div>
    <div>
        <input type="submit" value="Salvar" />
    </div>
    {% csrf_token %}
</form>
{% endblock %}
