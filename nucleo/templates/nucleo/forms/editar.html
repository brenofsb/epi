{% load static %}

<!DOCTYPE html>
<html>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edição</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="container">
        <h1>Editar Colaborador</h1>
        <p></p>
        <form action="{% url 'nucleo-editar' id=colaborador.id %}" method="POST">
            <div>
                <label>Nome</label>
                <input type="text" name="nome" value="{{ colaborador.nome }}"/>
            </div>
            <div>
                <label>Telefone</label>
                <input type="text" name="telefone" value="{{ colaborador.telefone }}"/>
            </div>
            <div>
                <input type="submit" value="Salvar"/>
            </div>
            {% csrf_token %}
        </form>
    </div>
</body>
</html>
