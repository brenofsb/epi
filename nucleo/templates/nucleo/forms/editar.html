{% load static %}

<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edição</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <header class="topo">
        <span class="topo-titulo">Home</span>
        <span class="topo-usuario">Breno Borges</span>
    </header>

    <div class="layout">
        <nav class="menu">
            <h3>Cadastros</h3>
            <a href="{% url 'nucleo-inicial' %}">Colaborador</a>
            <a href="#">Equipamentos</a>

            <h3>Ação</h3>
            <a href="#">Controle de EPI</a>

            <h3>Relatórios</h3>
            <a href="#">Empréstimo</a>

            <h3>Configurações</h3>
            <a href="#">Perfil</a>
            <a href="#">Sistema</a>

            <a href="#" class="menu-sair">Sair</a>
        </nav>

        <div class="container">
            <h1>Editar Colaborador</h1>
            <p></p>
            <form action="{% url 'nucleo-editar' id=colaborador.id %}" method="POST" class="formulario">
                <div>
                    <label>Nome</label>
                    <input type="text" name="nome" value="{{ colaborador.nome }}" />
                </div>
                <div>
                    <label>Telefone</label>
                    <input type="text" name="telefone" value="{{ colaborador.telefone }}" />
                </div>
                <div>
                    <input type="submit" value="Salvar" />
                </div>
                {% csrf_token %}
            </form>
        </div>
    </div>
</body>

</html>
