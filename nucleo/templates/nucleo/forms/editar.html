{% extends 'nucleo/base.html' %}

{% block titulo %}Edição{% endblock %}

{% block conteudo %}
<h1>Editar Colaborador</h1>

<form action="{% url 'nucleo-editar' id=colaborador.id %}" method="POST" class="formulario">
    <div>
        <label>Nome</label>
        <input type="text" name="nome" value="{{ colaborador.nome }}" />
    </div>
    <div>
        <label>Telefone</label>
        <input type="text" name="telefone" value="{{ colaborador.telefone }}" />
    </div>
    <div>
        <label for="setor_id">Setor</label>
        <select id="setor_id" name="setor_id" required>
            <option value="">Selecione um setor</option>
            {% for setor in setores %}
            <option value="{{ setor.id }}" {% if setor.id == colaborador.setor_id %}selected{% endif %}>
                {{ setor.nome }}
            </option>
            {% endfor %}
        </select>
    </div>
    <div>
        <input type="submit" value="Salvar" />
    </div>
    {% csrf_token %}
</form>
{% endblock %}
